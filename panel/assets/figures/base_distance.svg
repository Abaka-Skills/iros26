<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" font-family="Inter, Helvetica Neue, system-ui, sans-serif">
  <!-- Top view of the rig for measuring base_distance. Not to scale: the bases are drawn larger. -->
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#da7a3c"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#7c7267"/>
    </marker>
  </defs>
  <rect width="400" height="250" rx="14" fill="#f7f3ee"/>
  <text x="16" y="24" font-size="12" font-weight="650" fill="#2b2621">Top view · measure between the two followers</text>

  <!-- table and the two parallel rails the bases clamp to -->
  <rect x="22" y="40" width="356" height="150" rx="8" fill="#d5c8b7"/>
  <rect x="34" y="46" width="12" height="138" rx="3" fill="#3a3c40" opacity=".85"/>
  <rect x="354" y="46" width="12" height="138" rx="3" fill="#3a3c40" opacity=".85"/>
  <text x="40" y="200" font-size="10" fill="#7c7267" text-anchor="middle">rail</text>
  <text x="360" y="200" font-size="10" fill="#7c7267" text-anchor="middle">rail</text>

  <!-- left follower base (65 mm square) with its turret axis, arm pointing right -->
  <rect x="26" y="96" width="44" height="44" rx="8" fill="#3a3c40"/>
  <rect x="58" y="112" width="70" height="12" rx="6" fill="#3a3c40" opacity=".55"/>
  <circle cx="44" cy="118" r="9" fill="#f7f3ee"/><circle cx="44" cy="118" r="2.6" fill="#da7a3c"/>
  <!-- right follower base, facing left -->
  <rect x="330" y="96" width="44" height="44" rx="8" fill="#3a3c40"/>
  <rect x="272" y="112" width="70" height="12" rx="6" fill="#3a3c40" opacity=".55"/>
  <circle cx="356" cy="118" r="9" fill="#f7f3ee"/><circle cx="356" cy="118" r="2.6" fill="#da7a3c"/>

  <!-- main measurement: turret axis to turret axis -->
  <line x1="44" y1="86" x2="44" y2="104" stroke="#da7a3c" stroke-width="1.2"/>
  <line x1="356" y1="86" x2="356" y2="104" stroke="#da7a3c" stroke-width="1.2"/>
  <line x1="47" y1="80" x2="353" y2="80" stroke="#da7a3c" stroke-width="2" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <rect x="120" y="60" width="160" height="22" rx="11" fill="#f7f3ee"/>
  <text x="200" y="75" font-size="12" font-weight="650" fill="#da7a3c" text-anchor="middle">base_distance ≈ 0.91 m</text>
  <text x="200" y="102" font-size="10" fill="#2b2621" text-anchor="middle">turret axis (joint 0) → turret axis</text>

  <!-- alternative: front-edge gap + 2 × 37 mm -->
  <line x1="70" y1="150" x2="70" y2="164" stroke="#7c7267" stroke-width="1"/>
  <line x1="330" y1="150" x2="330" y2="164" stroke="#7c7267" stroke-width="1"/>
  <line x1="73" y1="158" x2="327" y2="158" stroke="#7c7267" stroke-width="1.2" stroke-dasharray="4 3" marker-start="url(#ag)" marker-end="url(#ag)"/>
  <text x="200" y="176" font-size="10" fill="#7c7267" text-anchor="middle">or: gap between the facing base edges + 0.074 m (2 × 37 mm)</text>

  <!-- operator side -->
  <text x="200" y="222" font-size="10.5" fill="#7c7267" text-anchor="middle">▼ operator / leader side</text>
  <text x="384" y="242" font-size="9" fill="#b3a899" text-anchor="end">not to scale · ±5 cm is enough</text>
</svg>
