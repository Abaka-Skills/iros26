[project]
name = "myaloha"
version = "0.1.0"
description = "Bimanual Trossen WidowX AI setup driven through LeRobot"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.141.1",
  "httpx>=0.28.1",
  "lerobot_robot_trossen",
  "lerobot_teleoperator_trossen",
  "mcp>=2.2",
  "uvicorn[standard]>=0.54.0",
  "websockets>=17.1",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.uv]
# Our arm controllers run firmware v1.9.0; the driver's major.minor must match.
override-dependencies = ["trossen-arm==1.9.3"]

[tool.uv.sources]
lerobot_robot_trossen = { workspace = true }
lerobot_teleoperator_trossen = { workspace = true }

[tool.uv.workspace]
members = ["thirdparty/lerobot_trossen/packages/*"]
exclude = ["simulator"]   # a project of its own (its own environment and lock)

[tool.pytest.ini_options]
markers = [
  "unplugged(*devices): simulator devices (arm or camera names) absent for the test",
  "cubes(scene): simulator cubes for the test, [{color, x, y, yaw, level}]",
]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore:.* encountered in matmul:RuntimeWarning"]   # Accelerate's false alarms (myaloha/__init__.py)
