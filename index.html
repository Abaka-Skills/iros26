<!DOCTYPE html>
<html lang="zh" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cube Sandbox</title>
<link rel="stylesheet" href="assets/css/ui.css">
</head>
<body>
<canvas id="c"></canvas>

<div class="fx" id="vignette"></div>
<div class="fx" id="grain"></div>

<div class="panel chip" id="brand">
  <b>Cube Sandbox</b>
  <span class="sub" id="gridlabel">10 × 15</span>
  <button class="btn wide" id="aloha" aria-pressed="true" title="显示 / 隐藏机械臂">ALOHA</button>
</div>

<div class="panel chip" id="topright">
  <div class="lang" id="lang" data-lang="zh" role="switch" title="中文 / English">
    <i class="knob"></i><span>中</span><span>EN</span>
  </div>
  <button class="btn" id="theme" title="切换深/浅背景">◐</button>
  <button class="btn wide" id="save" title="保存 layout.json">保存</button>
  <button class="btn wide" id="clear" title="清空所有方块并复位视角">重置</button>
</div>

<div class="panel" id="palette"></div>

<div class="panel" id="views">
  <button class="btn" id="rotL" title="左转 90°（Q）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg></button>
  <button class="btn" id="rotR" title="右转 90°（E）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg></button>
  <button class="btn" id="reset" aria-pressed="true" title="默认视角（H）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.6 20.4 7.3v9.4L12 21.4 3.6 16.7V7.3Z"/><path d="M12 12 20.4 7.3M12 12 3.6 7.3M12 12v9.4"/></svg></button>
  <button class="btn" id="tilt" aria-pressed="false" title="俯视图（R）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><path d="M12 8.6v6.8M8.6 12h6.8"/></svg></button>
  <button class="btn" id="front" aria-pressed="false" title="正视图（F）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="7" width="16" height="9.5" rx="1.6"/><path d="M2.5 20h19"/></svg></button>
</div>

<div class="panel keys" id="keys">
  <i class="keycap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
    stroke-linecap="round" stroke-linejoin="round">
    <rect x="2.5" y="6" width="19" height="12" rx="2.2"/>
    <path d="M6 9.5h.01M9.5 9.5h.01M13 9.5h.01M16.5 9.5h.01M6 13h.01M18 13h.01M9.5 14.5h5"/>
  </svg></i>
  <div class="hint" id="hint"></div>
</div>

<div class="toast" id="toast"></div>

<div id="needserver" hidden>
  <div class="panel box">
    <b id="needTitle">需要本地服务器</b>
    <p id="needBody">浏览器不允许 file:// 页面读取 config.json。在项目目录下跑：</p>
    <code class="cmd">./run.sh</code>
    <p class="sub" id="needAlt">或 python3 -m http.server 8000 后打开 localhost:8000</p>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
}}
</script>
<script type="module" src="assets/js/main.js"></script>
</body>
</html>
