name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage the visitor page as the site root
        run: |
          mkdir _site
          cp -R panel/assets panel/visitor.json panel/styleboard.html _site/
          cp panel/visitor.html _site/index.html
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site             # the public page is the cube sandbox (panel/visitor.html)
      - id: deployment
        uses: actions/deploy-pages@v4
